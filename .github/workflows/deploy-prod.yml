name: Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy-production:
    name: Test and Deploy to Production
    runs-on: ubuntu-latest
    if: github.repository == 'noam2030/task-manager'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP_CREDENTIALS == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          HAS_GCP_CREDENTIALS: ${{ secrets.GCP_SA_KEY != '' }}

      - name: Set up Cloud SDK
        if: env.HAS_GCP_CREDENTIALS == 'true'
        uses: google-github-actions/setup-gcloud@v2
        env:
          HAS_GCP_CREDENTIALS: ${{ secrets.GCP_SA_KEY != '' }}

      - name: Deploy to Cloud Run Production
        if: env.HAS_GCP_CREDENTIALS == 'true'
        run: |
          gcloud run deploy task-manager \
            --source . \
            --project ai-learning-499409 \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars="USE_FIRESTORE=true,GOOGLE_CLOUD_PROJECT=ai-learning-499409" \
            --quiet
        env:
          HAS_GCP_CREDENTIALS: ${{ secrets.GCP_SA_KEY != '' }}

      - name: Deploy Frontend to Vercel (task-manager-ui)
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: npx --yes vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_abCCfq6oAKpFKOLdLU0hsGg5' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_I9gsL2nntc9KRNzduqiAiGJ2jjaS' }}
